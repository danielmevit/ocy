name: Rust

# Builds and tests the Rust workspace (rust/) on Linux and Windows. See docs/rust/PLAN.md.
on:
  push:
    branches: ["main", "dev"]
    paths: ["rust/**", ".github/workflows/rust.yml", "assets/**", "content/strings/**", "tests/Ocy.Core.Tests/**"]
  pull_request:
    paths: ["rust/**", ".github/workflows/rust.yml"]
  workflow_dispatch:

permissions: {}

jobs:
  macos:
    runs-on: macos-latest
    permissions:
      contents: read
    defaults:
      run:
        working-directory: rust
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - name: Toolchain (from rust-toolchain.toml)
        run: rustup show active-toolchain || rustup toolchain install
      - name: Format
        run: cargo fmt --all -- --check
      - name: Clippy
        run: cargo clippy --workspace --all-targets --locked -j 4 -- -D warnings
      - name: Build
        run: cargo build --workspace --locked -j 4
      - name: Test
        run: cargo test --workspace --locked -j 4

  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    permissions:
      contents: read
    defaults:
      run:
        working-directory: rust
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - name: Toolchain (from rust-toolchain.toml)
        run: rustup show active-toolchain || rustup toolchain install
      - name: Linux system libraries (Slint fonts via fontconfig; tray via GTK/appindicator + xdo)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends libfontconfig1-dev libxdo-dev libayatana-appindicator3-dev
      - name: Format
        run: cargo fmt --all -- --check
      - name: Clippy
        run: cargo clippy --workspace --all-targets --locked -- -D warnings
      - name: Clippy (Store feature, Windows)
        if: runner.os == 'Windows'
        run: cargo clippy -p ocy-app --features store --all-targets --locked -- -D warnings
      - name: Test
        run: cargo test --workspace --locked
      - name: Test (Store feature)
        run: cargo test -p ocy-app --features store --locked
      - name: Windows target compile check
        if: runner.os == 'Linux'
        run: |
          rustup target add x86_64-pc-windows-msvc
          cargo check --workspace --all-targets --locked --target x86_64-pc-windows-msvc
          cargo check -p ocy-app --features store --all-targets --locked --target x86_64-pc-windows-msvc
      - name: Parity with the C# engine tests
        if: runner.os == 'Linux'
        working-directory: .
        run: python3 rust/tools/parity_check.py
      - name: Release tools unit tests
        if: runner.os == 'Linux'
        working-directory: .
        env:
          PYTHONDONTWRITEBYTECODE: "1"
        run: python3 -m unittest discover rust/tools/tests

  windows-release:
    runs-on: windows-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - name: Toolchain (from rust-toolchain.toml)
        working-directory: rust
        run: rustup show active-toolchain || rustup toolchain install
      - name: Build release binary
        working-directory: rust
        # PostHog key compiled in via option_env! in ocy-app's usage_stats.rs.
        # Absent/empty secret -> build_key() is None -> usage stats stay off.
        env:
          OCY_POSTHOG_KEY: ${{ secrets.OCY_POSTHOG_KEY }}
        shell: pwsh
        run: |
          # Remap build-machine paths out of the binary (CR2c). No rule is ever emitted
          # with an empty FROM: an empty FROM makes rustc prefix every *relative* path
          # with the TO (the CI exe shipped rustup\apps\... paths because RUSTUP_HOME
          # is not set on the runner). rustc applies the LAST matching rule, so the
          # most specific prefixes must come last.
          $separator = [char]31
          $cargoHome = if ($env:CARGO_HOME) { $env:CARGO_HOME } else { Join-Path $env:USERPROFILE ".cargo" }
          $rustupHome = if ($env:RUSTUP_HOME) { $env:RUSTUP_HOME } else { Join-Path $env:USERPROFILE ".rustup" }
          $targetDir = if ($env:CARGO_TARGET_DIR) { $env:CARGO_TARGET_DIR } else { Join-Path $env:GITHUB_WORKSPACE "rust\target" }
          $sysroot = (rustc --print sysroot).Trim()
          $flags = New-Object System.Collections.Generic.List[string]
          $remaps = @(
            @{ From = $rustupHome;          To = "rustup" },
            @{ From = $env:GITHUB_WORKSPACE; To = "ocy" },
            @{ From = $cargoHome;           To = "cargo" },
            @{ From = $targetDir;           To = "target" },
            @{ From = $sysroot;             To = "rustup" }
          )
          foreach ($remap in $remaps) {
            if (-not $remap.From) { continue }
            $flags.Add("--remap-path-prefix=$($remap.From)=$($remap.To)")
            if ($remap.From -match '^[A-Za-z]:') {
              # rustc canonicalizes some Windows paths to \\?\ form; cover that spelling too.
              $flags.Add("--remap-path-prefix=\\?\$($remap.From)=$($remap.To)")
            }
          }
          $env:CARGO_ENCODED_RUSTFLAGS = $flags -join $separator
          Write-Host "CARGO_ENCODED_RUSTFLAGS: $($flags -join ' ')"
          cargo build -p ocy-app --release --locked
      - name: Check the binary for leaked build-machine paths
        shell: pwsh
        run: |
          $targetDir = if ($env:CARGO_TARGET_DIR) { $env:CARGO_TARGET_DIR } else { "rust/target" }
          python rust/tools/path_leak_check.py (Join-Path $targetDir "release/Ocy.exe")
      - name: Check Ocy.exe size budget (<= 15 MB)
        shell: pwsh
        run: |
          $targetDir = if ($env:CARGO_TARGET_DIR) { $env:CARGO_TARGET_DIR } else { "rust/target" }
          $exePath = Join-Path $targetDir "release/Ocy.exe"
          $exe = Get-Item $exePath
          $bytes = $exe.Length
          $mib = [math]::Round($bytes / 1MB, 2)
          $budgetBytes = 15 * 1024 * 1024
          Write-Host ("Ocy.exe size: {0} bytes ({1} MiB; budget: {2} bytes / 15 MiB)" -f $bytes, $mib, $budgetBytes)
          if ($bytes -gt $budgetBytes) {
            Write-Error ("Ocy.exe exceeds 15 MiB budget: {0} bytes > {1} bytes" -f $bytes, $budgetBytes)
            exit 1
          }
          $pdbPath = Join-Path (Split-Path $exePath -Parent) "Ocy.pdb"
          if (-not (Test-Path $pdbPath)) {
            Write-Error ("Missing matching PDB: $pdbPath")
          }
          $pdb = Get-Item $pdbPath
          $pdbMib = [math]::Round($pdb.Length / 1MB, 2)
          Write-Host ("Ocy.pdb size: {0} bytes ({1} MiB)" -f $pdb.Length, $pdbMib)
      - name: Generate third-party notices
        run: python rust/tools/notices.py --out "${{ runner.temp }}/THIRD-PARTY-NOTICES.txt"
      - name: Build deterministic release zip
        shell: pwsh
        run: |
          $targetDir = if ($env:CARGO_TARGET_DIR) { $env:CARGO_TARGET_DIR } else { "rust/target" }
          $exePath = Join-Path $targetDir "release/Ocy.exe"
          python rust/tools/dist.py --exe $exePath --notices "${{ runner.temp }}/THIRD-PARTY-NOTICES.txt" --out dist
      - name: Upload release zip and checksum
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: ocy-win-x64
          path: |
            dist/*.zip
            dist/*.zip.sha256
          if-no-files-found: error
      - name: Upload Windows PDB symbols
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: ocy-win-x64-pdb
          path: |
            rust/target/release/Ocy.pdb
          if-no-files-found: error
