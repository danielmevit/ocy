name: Deploy Ocy site to Pages

# Builds the Astro site in site/ and publishes it to
# https://danielmevit.github.io/ocy/
#
# Hardening: every action is pinned to a full commit SHA (the tag is in the comment), and the
# write/OIDC permissions are granted only to the deploy job, which uses GitHub's own action.

on:
  push:
    branches: ["main"]
    paths:
      - "site/**"
      - "assets/illustrations/**"
      - "assets/icons/app/**"
      - "assets/icons/tray/**"
      - "content/strings/en.json"
      - "Directory.Build.props"
      - ".github/workflows/deploy.yml"
  workflow_dispatch:

# Nothing by default; each job asks for exactly what it needs.
permissions: {}

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false

      - name: Build the site
        uses: withastro/action@56781b97402ce0487b7e61ce2cb960c0e2cc5289 # v3.0.2
        with:
          package-manager: npm
          path: ./site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4.0.5
