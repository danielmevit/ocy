# Ocy Rust workspace (migration from C#; see docs/rust/PLAN.md). Becomes the repo root at the switch to 0.2.0.
[workspace]
resolver = "3"
members = [
    "crates/damt-app",
    "crates/damt-art",
    "crates/damt-build",
    "crates/damt-overlay",
    "crates/damt-platform",
    "crates/damt-platform-linux",
    "crates/damt-platform-mac",
    "crates/damt-platform-win",
    "crates/damt-theme",
    "crates/damt-ui",
    "apps/ocy/ocy-core",
    "apps/ocy/ocy-app",
    "apps/ocy/ocy-ui",
]

[workspace.package]
version = "0.3.0"
edition = "2024"
rust-version = "1.95"
license = "AGPL-3.0-only"
authors = ["Daniel Mitev (Daniel Mevit)"]
repository = "https://github.com/danielmevit/ocy"

[workspace.dependencies]
damt-build = { path = "crates/damt-build" }
damt-platform = { path = "crates/damt-platform" }
embed-manifest = "=1.5.1"
jiff = { version = "=1.0.1", features = ["serde"] }
raw-window-handle = "=0.6.2"
serde = { version = "=1.0.229", features = ["derive"] }
serde_json = "=1.0.154"
slint = { version = "=1.19.0", default-features = false, features = ["std", "compat-1-2", "backend-winit", "renderer-software", "raw-window-handle-06", "system-tray", "unstable-winit-030", "accessibility"] }
thiserror = "=2.0.21"
proptest = "=1.12.0"
resvg = { version = "=0.50.0", default-features = false }
roxmltree = "=0.21.2"
slint-build = "=1.19.0"
slint-interpreter = { version = "=1.19.0", default-features = false, features = ["std", "compat-1-18"] }
spin_on = "=0.1.1"
toml = "=1.2.1"
windows = { version = "=0.62.2", features = [
    "Data_Xml_Dom",
    "UI_Notifications",
    "Win32_Foundation",
    "Win32_Graphics_DirectWrite",
    "Win32_Graphics_Gdi",
    "Win32_Security",
    "Win32_System_Com",
    "Win32_System_LibraryLoader",
    "Win32_System_Power",
    "Win32_System_Registry",
    "Win32_System_RemoteDesktop",
    "Win32_System_SystemInformation",
    "Win32_System_Threading",
    "Win32_UI_HiDpi",
    "Win32_UI_Input_KeyboardAndMouse",
    "Win32_UI_Shell",
    "Win32_UI_WindowsAndMessaging",
] }

[workspace.lints.rust]
unsafe_op_in_unsafe_fn = "deny"
missing_debug_implementations = "warn"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }

# Debug/test builds: line numbers for our own crates, no debug info for dependencies.
# Keeps file:line in panics and test failures while cutting test-binary size several times
# (full debug info made ~22 GB of build cache per worker).
[profile.dev]
debug = "line-tables-only"

[profile.dev.package."*"]
debug = false

[profile.release]
lto = "fat"
codegen-units = 1
opt-level = 3
strip = true
debug = "limited"
split-debuginfo = "packed"
panic = "abort"
