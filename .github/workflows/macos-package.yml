name: macOS app package

on:
  push:
    branches: ["dev", "main"]
    paths:
      - "rust/**"
      - "packaging/macos/**"
      - "assets/icons/**"
      - ".github/workflows/macos-package.yml"
  workflow_dispatch:

permissions: {}

jobs:
  macos-package:
    runs-on: macos-latest
    timeout-minutes: 45
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false

      - name: Build macOS app
        timeout-minutes: 30
        run: bash packaging/macos/build_app.sh | tee macos-build.log

      - name: Find app and archive
        id: package
        shell: bash
        run: |
          VERSION="$(python3 - <<'PY'
          import tomllib
          with open("rust/Cargo.toml", "rb") as source:
              print(tomllib.load(source)["workspace"]["package"]["version"])
          PY
          )"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "app=packaging/macos/dist/Ocy.app" >> "$GITHUB_OUTPUT"
          echo "archive=packaging/macos/dist/Ocy-$VERSION-macos-universal.zip" >> "$GITHUB_OUTPUT"
          echo "checksum=packaging/macos/dist/Ocy-$VERSION-macos-universal.zip.sha256" >> "$GITHUB_OUTPUT"

      - name: Probe short break
        timeout-minutes: 2
        shell: bash
        run: |
          set -euo pipefail
          APP="${{ steps.package.outputs.app }}"
          PROBE="packaging/macos/ci/window_probe.swift"
          mkdir -p probe-artifacts
          swift "$PROBE" "$$" > probe-artifacts/short-frontmost-before.json
          "$APP/Contents/MacOS/Ocy" --demo-break short >probe-artifacts/short-launch.log 2>&1 &
          PID=$!
          trap 'kill "$PID" 2>/dev/null || true' EXIT
          sleep 3
          swift "$PROBE" "$PID" > probe-artifacts/short-probe.json
          if ! screencapture -x probe-artifacts/probe-short.png 2>probe-artifacts/short-screencapture.log; then
            echo "screencapture blocked; probe JSON retained" >> probe-artifacts/short-screencapture.log
          fi
          PID="$PID" python3 - <<'PY'
          import json
          import os

          with open("probe-artifacts/short-frontmost-before.json", encoding="utf-8") as source:
              before = json.load(source)
          with open("probe-artifacts/short-probe.json", encoding="utf-8") as source:
              probe = json.load(source)
          windows = [w for w in probe["windows"] if w["on_screen"]]
          frontmost = probe["frontmost"]["bundle_id"]
          frontmost_pid = probe["frontmost"]["pid"]
          pid = int(os.environ["PID"])
          print(f"before frontmost: bundle_id={before['frontmost']['bundle_id']} pid={before['frontmost']['pid']}")
          print(f"after frontmost: bundle_id={frontmost} pid={frontmost_pid}")
          assert windows, "no on-screen Ocy window for short break"
          assert frontmost != "xyz.damt.ocy", f"short break took focus; frontmost={frontmost}"
          assert frontmost_pid != pid, f"short break took focus; frontmost_pid={frontmost_pid}, pid={pid}"
          print(json.dumps(probe, sort_keys=True))
          PY
          kill "$PID" 2>/dev/null || true
          wait "$PID" 2>/dev/null || true

      - name: Probe long break
        timeout-minutes: 2
        shell: bash
        run: |
          set -euo pipefail
          APP="${{ steps.package.outputs.app }}"
          PROBE="packaging/macos/ci/window_probe.swift"
          mkdir -p probe-artifacts
          swift "$PROBE" "$$" > probe-artifacts/long-frontmost-before.json
          "$APP/Contents/MacOS/Ocy" --demo-break long >probe-artifacts/long-launch.log 2>&1 &
          PID=$!
          trap 'kill "$PID" 2>/dev/null || true' EXIT
          sleep 4
          swift "$PROBE" "$PID" > probe-artifacts/long-probe.json
          if ! screencapture -x probe-artifacts/probe-long.png 2>probe-artifacts/long-screencapture.log; then
            echo "screencapture blocked; probe JSON retained" >> probe-artifacts/long-screencapture.log
          fi
          python3 - <<'PY'
          import json

          with open("probe-artifacts/long-frontmost-before.json", encoding="utf-8") as source:
              before = json.load(source)
          with open("probe-artifacts/long-probe.json", encoding="utf-8") as source:
              probe = json.load(source)
          print(f"before frontmost: bundle_id={before['frontmost']['bundle_id']} pid={before['frontmost']['pid']}")
          print(f"after frontmost: bundle_id={probe['frontmost']['bundle_id']} pid={probe['frontmost']['pid']}")
          windows = [w for w in probe["windows"] if w["on_screen"]]
          dims = [w for w in windows if w["bounds"]["width"] >= 800 and w["bounds"]["height"] >= 600]
          cards = [w for w in windows if w not in dims]
          assert dims, "no monitor-sized dim window found"
          assert cards, "no small long-break card window found"
          card_layer = max(w["layer"] for w in cards)
          dim_layer = max(w["layer"] for w in dims)
          assert card_layer > dim_layer, f"card layer {card_layer} must be above dim layer {dim_layer}"
          print(json.dumps(probe, sort_keys=True))
          PY
          kill "$PID" 2>/dev/null || true
          wait "$PID" 2>/dev/null || true

      - name: Probe warning
        timeout-minutes: 2
        shell: bash
        run: |
          set -euo pipefail
          APP="${{ steps.package.outputs.app }}"
          PROBE="packaging/macos/ci/window_probe.swift"
          mkdir -p probe-artifacts
          swift "$PROBE" "$$" > probe-artifacts/warning-frontmost-before.json
          "$APP/Contents/MacOS/Ocy" --demo-break warning >probe-artifacts/warning-launch.log 2>&1 &
          PID=$!
          trap 'kill "$PID" 2>/dev/null || true' EXIT
          sleep 3
          swift "$PROBE" "$PID" > probe-artifacts/warning-probe.json
          if ! screencapture -x probe-artifacts/probe-warning.png 2>probe-artifacts/warning-screencapture.log; then
            echo "screencapture blocked; probe JSON retained" >> probe-artifacts/warning-screencapture.log
          fi
          PID="$PID" python3 - <<'PY'
          import json
          import os

          with open("probe-artifacts/warning-frontmost-before.json", encoding="utf-8") as source:
              before = json.load(source)
          with open("probe-artifacts/warning-probe.json", encoding="utf-8") as source:
              probe = json.load(source)
          windows = [w for w in probe["windows"] if w["on_screen"]]
          frontmost = probe["frontmost"]["bundle_id"]
          frontmost_pid = probe["frontmost"]["pid"]
          pid = int(os.environ["PID"])
          print(f"before frontmost: bundle_id={before['frontmost']['bundle_id']} pid={before['frontmost']['pid']}")
          print(f"after frontmost: bundle_id={frontmost} pid={frontmost_pid}")
          assert windows, "no on-screen Ocy window for warning"
          assert frontmost != "xyz.damt.ocy", f"warning took focus; frontmost={frontmost}"
          assert frontmost_pid != pid, f"warning took focus; frontmost_pid={frontmost_pid}, pid={pid}"
          print(json.dumps(probe, sort_keys=True))
          PY
          kill "$PID" 2>/dev/null || true
          wait "$PID" 2>/dev/null || true

      - name: Probe settings
        timeout-minutes: 2
        shell: bash
        run: |
          set -euo pipefail
          APP="${{ steps.package.outputs.app }}"
          PROBE="packaging/macos/ci/window_probe.swift"
          mkdir -p probe-artifacts
          "$APP/Contents/MacOS/Ocy" --demo-settings >probe-artifacts/settings-launch.log 2>&1 &
          PID=$!
          trap 'kill "$PID" 2>/dev/null || true' EXIT
          sleep 3
          swift "$PROBE" "$PID" > probe-artifacts/settings-probe.json
          if ! screencapture -x probe-artifacts/probe-settings.png 2>probe-artifacts/settings-screencapture.log; then
            echo "screencapture blocked; probe JSON retained" >> probe-artifacts/settings-screencapture.log
          fi
          kill "$PID" 2>/dev/null || true
          wait "$PID" 2>/dev/null || true

      - name: Upload app artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: ocy-macos-app
          path: |
            ${{ steps.package.outputs.archive }}
            ${{ steps.package.outputs.checksum }}
          if-no-files-found: error

      - name: Upload probe artifact
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: ocy-macos-probe
          path: |
            probe-artifacts/**
            macos-build.log
          if-no-files-found: warn
