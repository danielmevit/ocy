[package]
name = "ocy-app"
description = "Ocy desktop application host: tray, break coordination, native overlays, and Windows packaging."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true

[[bin]]
name = "Ocy"
path = "src/main.rs"

[features]
default = []
store = ["damt-platform-win/store"]

[dependencies]
damt-app = { path = "../../../crates/damt-app" }
damt-art = { path = "../../../crates/damt-art" }
damt-overlay = { path = "../../../crates/damt-overlay" }
damt-platform.workspace = true
damt-platform-win = { path = "../../../crates/damt-platform-win" }
damt-theme = { path = "../../../crates/damt-theme" }
jiff.workspace = true
ocy-core = { path = "../ocy-core" }
ocy-ui = { path = "../ocy-ui" }
raw-window-handle.workspace = true
resvg.workspace = true
serde.workspace = true
serde_json.workspace = true
slint.workspace = true

[target.'cfg(windows)'.dependencies]
windows = { workspace = true, features = ["Win32_Globalization", "Win32_System_Console", "Win32_System_ProcessStatus", "Win32_UI_Accessibility"] }

[target.'cfg(target_os = "linux")'.dependencies]
damt-platform-linux = { path = "../../../crates/damt-platform-linux" }

[target.'cfg(target_os = "macos")'.dependencies]
damt-platform-mac = { path = "../../../crates/damt-platform-mac" }
objc2 = "=0.6.5"
objc2-app-kit = { version = "=0.3.2", features = [
    "NSApplication",
    "NSResponder",
    "NSRunningApplication",
    "NSView",
    "NSWindow",
] }
objc2-foundation = { version = "=0.3.2", features = ["NSObject"] }

[build-dependencies]
damt-build.workspace = true
embed-manifest.workspace = true
serde_json.workspace = true

[lints]
workspace = true
