name: Linux Flatpak

# Builds an installable Flatpak bundle for Linux testers using flatpak-builder.
# See docs/rust/LINUX.md §14 L5.
on:
  push:
    branches: ["dev", "main"]
    paths:
      - "rust/**"
      - "packaging/linux/**"
      - "assets/icons/**"
      - "content/strings/**"
      - ".github/workflows/linux-flatpak.yml"
  workflow_dispatch:

permissions: {}

jobs:
  flatpak:
    name: Flatpak (x86_64)
    runs-on: ubuntu-latest
    permissions:
      contents: read
    container:
      image: ghcr.io/flathub-infra/flatpak-github-actions:freedesktop-26.08
      options: --privileged
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false

      - name: Read app version
        id: meta
        shell: bash
        run: |
          version=$(python3 - <<'PY'
          import pathlib, tomllib
          ws = tomllib.loads(pathlib.Path("rust/Cargo.toml").read_text(encoding="utf-8"))
          print(ws["workspace"]["package"]["version"])
          PY
          )
          echo "version=${version}" >> "$GITHUB_OUTPUT"

      - name: Validate desktop entry and AppStream metainfo
        shell: bash
        run: |
          desktop-file-validate packaging/linux/xyz.damt.ocy.desktop
          appstreamcli validate --no-net packaging/linux/xyz.damt.ocy.metainfo.xml

      - name: Generate vendored Cargo sources
        shell: bash
        env:
          GENERATOR_COMMIT: 9d86d336a39b9af38b86f114b6ce5820fe260f91
        run: |
          set -euo pipefail
          curl -fsSL "https://raw.githubusercontent.com/flatpak/flatpak-builder-tools/${GENERATOR_COMMIT}/cargo/flatpak-cargo-generator.py" -o /tmp/flatpak-cargo-generator.py
          python3 -m venv /tmp/flatpak-cargo-venv
          /tmp/flatpak-cargo-venv/bin/pip install --no-cache-dir "aiohttp>=3.9.5,<4.0.0" "tomlkit>=0.13.3,<1.0"
          /tmp/flatpak-cargo-venv/bin/python /tmp/flatpak-cargo-generator.py rust/Cargo.lock -o packaging/linux/cargo-sources.json
          rm -rf /tmp/flatpak-cargo-venv /tmp/flatpak-cargo-generator.py

      - name: Build Flatpak bundle
        uses: flatpak/flatpak-github-actions/flatpak-builder@79327416609af08178ad73b352877e51450790b3 # v6.8
        with:
          manifest-path: packaging/linux/xyz.damt.ocy.yml
          bundle: Ocy-${{ steps.meta.outputs.version }}-x86_64.flatpak
          branch: stable
          upload-artifact: false

      - name: Upload Flatpak bundle
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ocy-linux-flatpak
          path: Ocy-${{ steps.meta.outputs.version }}-x86_64.flatpak
          if-no-files-found: error
