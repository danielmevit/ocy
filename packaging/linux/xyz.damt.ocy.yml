# Flatpak manifest for Ocy (L5a — CI bundle build; Flathub submission still pending).
#
# Notes:
# - Runtime: org.freedesktop.Platform 26.08 (current stable Freedesktop runtime,
#   supported 2026-08 to 2028-09) + org.freedesktop.Sdk.Extension.rust-stable//26.08
#   (ships Rust 1.98.0, satisfying rust/rust-toolchain.toml 1.95.0 / MSRV 1.95).
# - Vendored crate sources (cargo-sources.json) are generated in CI from
#   rust/Cargo.lock by flatpak-builder-tools' flatpak-cargo-generator.py and are
#   not committed yet; Flathub submission will require committing cargo-sources.json.
# - App ID: xyz.damt.ocy matches the Windows identity (rust/apps/ocy/ocy-app/src/instance.rs).
#   Flathub domain ownership proof is still pending (docs/rust/LINUX.md §14 L5).

app-id: xyz.damt.ocy
branch: stable
runtime: org.freedesktop.Platform
runtime-version: "26.08"
sdk: org.freedesktop.Sdk
sdk-extensions:
  - org.freedesktop.Sdk.Extension.rust-stable
command: Ocy

finish-args:
  # UI on Wayland and X11 (X11 also needs --share=ipc).
  - --socket=wayland
  - --socket=fallback-x11
  - --share=ipc
  # Lock/unlock + suspend/resume signals from logind (system bus).
  - --system-talk-name=org.freedesktop.login1
  # Tray (StatusNotifierItem via ksni) and desktop notifications.
  - --talk-name=org.kde.StatusNotifierWatcher
  - --talk-name=org.freedesktop.Notifications
  # Idle-time fallback on GNOME Wayland used today by damt-platform-linux/src/linux/idle.rs.
  # xdg-dbus-proxy matches exact bus names unless ".*" is specified.
  - --talk-name=org.gnome.Mutter.IdleMonitor
  # Settings portal (color-scheme) needs no finish-args.
  # Anonymous opt-in usage stats (PostHog batch): outbound HTTPS only, opt-in, no listener.
  - --share=network

modules:
  - name: ocy
    buildsystem: simple
    build-options:
      append-path: /usr/lib/sdk/rust-stable/bin
      env:
        CARGO_HOME: /run/build/ocy/cargo
        CARGO_NET_OFFLINE: "true"
        RUSTFLAGS: "--remap-path-prefix=/run/build/ocy/cargo=cargo --remap-path-prefix=/run/build/ocy/rust/target=target --remap-path-prefix=/run/build/ocy=ocy --remap-path-prefix=/usr/lib/sdk/rust-stable/rustup=rustup"
    build-commands:
      - cd rust && cargo --offline build --release --locked -p ocy-app
      - install -Dm755 rust/target/release/Ocy /app/bin/Ocy
      - install -Dm644 packaging/linux/xyz.damt.ocy.desktop /app/share/applications/xyz.damt.ocy.desktop
      - install -Dm644 packaging/linux/xyz.damt.ocy.metainfo.xml /app/share/metainfo/xyz.damt.ocy.metainfo.xml
      - install -Dm644 assets/icons/app/png/ocy-app-64.png /app/share/icons/hicolor/64x64/apps/xyz.damt.ocy.png
      - install -Dm644 assets/icons/app/png/ocy-app-128.png /app/share/icons/hicolor/128x128/apps/xyz.damt.ocy.png
      - install -Dm644 assets/icons/app/png/ocy-app-256.png /app/share/icons/hicolor/256x256/apps/xyz.damt.ocy.png
      - command -v rsvg-convert >/dev/null 2>&1 || { echo "ERROR: rsvg-convert is required to render the 512x512 icon from assets/icons/app/ocy-app.svg (install librsvg, e.g. the org.freedesktop.Sdk extension)"; exit 1; }
      - install -d /app/share/icons/hicolor/512x512/apps
      - rsvg-convert -w 512 -h 512 assets/icons/app/ocy-app.svg -o /app/share/icons/hicolor/512x512/apps/xyz.damt.ocy.png
      - install -Dm644 assets/icons/app/ocy-app.svg /app/share/icons/hicolor/scalable/apps/xyz.damt.ocy.svg
    sources:
      - type: dir
        path: ../..
      - cargo-sources.json
