[package]
name = "damt-platform-linux"
description = "Linux implementations of the damt-platform OS-service contracts (idle, focus, session, autostart, screens, theme, motion, notifier, tray)."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true

[target.'cfg(target_os = "linux")'.dependencies]
async-channel = "=2.5.0"
async-io = "=2.6.0"
damt-platform.workspace = true
futures-lite = "=2.6.1"
ksni = { version = "=0.3.7", default-features = false, features = ["async-io", "blocking"] }
png = "=0.18.1"
thiserror.workspace = true
x11rb = { version = "=0.13.2", features = ["screensaver", "randr"] }
wayland-client = "=0.31.15"
wayland-protocols = { version = "=0.32.13", features = ["client", "staging"] }
zbus = { version = "=5.19.0", default-features = false, features = ["async-io", "blocking-api"] }

[lints]
workspace = true
